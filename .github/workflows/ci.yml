name: local-validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-10-11
        with:
          persist-credentials: false
      - name: Runtime
        run: python3 --version
      - name: Test and inspect public files
        run: |
          if test -f tests/test_risk.py; then
            make check
          else
            python3 scripts/check_repository.py
            echo "Documentation foundation only; executable tests are in the feature branches."
          fi
